<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="gl"></canvas><canvas id="mk"></canvas>
<script src="three.min.js"></script>
<script>
'use strict';
/* AKSA Residencies placeholder scene: one tower (25 floors x 12 units) on a riverfront plot in Montijo,
   surroundings from OpenStreetMap (buildings, roads, greens, coastline). Units: metres, x east, z south. */
const $=s=>document.querySelector(s);
const V3=THREE.Vector3, V2=THREE.Vector2;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const pad2=n=>String(n).padStart(2,'0');
const canvas=$('#gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const MAXANI=renderer.capabilities.getMaxAnisotropy();
const maskR=new THREE.WebGLRenderer({canvas:$('#mk'),antialias:false,preserveDrawingBuffer:true});
maskR.setPixelRatio(1);maskR.outputEncoding=THREE.LinearEncoding;maskR.toneMapping=THREE.NoToneMapping;
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const std=(color,o={})=>new THREE.MeshStandardMaterial(Object.assign({color,roughness:.85},o));

(async()=>{
const SC=await (await fetch('scene/scene.json')).json();
const PLOT=SC.plot;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,1,30000);
scene.fog=new THREE.Fog(0xD9E3E6,1800,12500);
scene.add(new THREE.HemisphereLight(0xDCEBF3,0xB9A98C,.6));
const sun=new THREE.DirectionalLight(0xFFE9C8,1.3);
sun.position.set(PLOT.x-380,520,PLOT.z+300);sun.target.position.set(PLOT.x,0,PLOT.z-60);scene.add(sun.target);
sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-700,right:700,top:700,bottom:-700,near:50,far:2200});
sun.shadow.bias=-.0004;sun.shadow.normalBias=.6;scene.add(sun);
{const t=ctex(4,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#4D8CC2');gr.addColorStop(.34,'#98C2E0');gr.addColorStop(.5,'#E1EAEC');gr.addColorStop(1,'#E1EAEC');g.fillStyle=gr;g.fillRect(0,0,w,h);});
 scene.add(new THREE.Mesh(new THREE.SphereGeometry(26000,48,24),new THREE.MeshBasicMaterial({map:t,side:THREE.BackSide,fog:false,toneMapped:false})));}

/* ---------------- water (Tagus estuary) ---------------- */
const waterTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#DDE9E8';g.fillRect(0,0,w,h);const r=rng(11);
  for(let i=0;i<260;i++){g.strokeStyle=r()<.55?'rgba(255,255,255,.55)':'rgba(20,60,70,.12)';g.lineWidth=.8+r()*1.3;const x=r()*w,y=r()*h,l=8+r()*22;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+l/2,y-1-r()*3,x+l,y);g.stroke();}},[900,900]);
const water=new THREE.Mesh(new THREE.PlaneGeometry(60000,60000),std(0x3F7482,{map:waterTex,roughness:.3,metalness:.05}));
water.rotation.x=-Math.PI/2;water.receiveShadow=true;scene.add(water);

/* ---------------- land ---------------- */
const GY=.8;
const [TX0,TZ0,TSZ]=SC.tex;
const groundTex=await new Promise(r=>new THREE.TextureLoader().load('scene/ground.jpg',t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;r(t);}));
function landMesh(shapes,top,mat,uvTex,depth){
  const sh=shapes.map(s=>{const S=new THREE.Shape(s.outer.map(p=>new V2(p[0],-p[1])));s.holes.forEach(h=>S.holes.push(new THREE.Path(h.map(p=>new V2(p[0],-p[1])))));return S;});
  const geo=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false,curveSegments:1});geo.rotateX(-Math.PI/2);
  if(uvTex){const pos=geo.attributes.position,uv=geo.attributes.uv;for(let i=0;i<pos.count;i++){uv.setXY(i,(pos.getX(i)-TX0)/TSZ,1-(pos.getZ(i)-TZ0)/TSZ);}uv.needsUpdate=true;}
  const m=new THREE.Mesh(geo,mat);m.position.y=top-depth;m.receiveShadow=true;scene.add(m);return m;}
groundTex.wrapS=groundTex.wrapT=THREE.ClampToEdgeWrapping;
landMesh(SC.landCoarse,GY-.15,std(0xCBC4B1,{roughness:.95}),false,2);
const quay=std(0xB9B2A4,{roughness:.9});
landMesh(SC.landFine,GY,[std(0xFFFFFF,{map:groundTex,roughness:.95}),quay],true,2.2);
// distant shores so the horizon is not an empty sea
{const r=rng(21);const g=new THREE.Group();const m=std(0x9AA3A0,{roughness:1});
 for(let k=0;k<60;k++){const a=k/60*Math.PI*2,R=10500+r()*2500;const w=1200+r()*1500,h=15+r()*70;const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,900),m);b.position.set(Math.cos(a)*R,h/2-5,Math.sin(a)*R);b.rotation.y=-a;g.add(b);}
 scene.add(g);}

/* ---------------- OSM buildings (one merged mesh, vertex colours) ---------------- */
{
  const P=[],N=[],C=[];const col=new THREE.Color();
  const push=(a,b,c,n,cl)=>{P.push(...a,...b,...c);for(let i=0;i<3;i++){N.push(...n);C.push(cl.r,cl.g,cl.b);}};
  const tri=new V3(),e1=new V3(),e2=new V3();
  const face=(a,b,c,cl)=>{e1.set(b[0]-a[0],b[1]-a[1],b[2]-a[2]);e2.set(c[0]-a[0],c[1]-a[1],c[2]-a[2]);tri.crossVectors(e1,e2).normalize();push(a,b,c,[tri.x,tri.y,tri.z],cl);};
  const wallC=new THREE.Color(),roofC=new THREE.Color(),shadeC=new THREE.Color();
  SC.buildings.forEach(b=>{
    let pts=[];for(let i=0;i<b.p.length;i+=2)pts.push([b.p[i],b.p[i+1]]);
    // CCW in x,-z space
    let A=0;for(let i=0;i<pts.length;i++){const [x1,z1]=pts[i],[x2,z2]=pts[(i+1)%pts.length];A+=x1*(-z2)-x2*(-z1);}if(A<0)pts.reverse();
    const h=b.h,y0=GY-.2,y1=GY+h;wallC.set(b.w).convertSRGBToLinear();roofC.set(b.r||b.w).convertSRGBToLinear();
    const ridge=b.g?Math.min(3.2,h*.45):0;
    // walls
    for(let i=0;i<pts.length;i++){const [x1,z1]=pts[i],[x2,z2]=pts[(i+1)%pts.length];
      shadeC.copy(wallC).multiplyScalar(.97+((i*37)%7)/100);
      face([x1,y0,z1],[x2,y0,z2],[x2,y1,z2],shadeC);face([x1,y0,z1],[x2,y1,z2],[x1,y1,z1],shadeC);}
    if(ridge){ // gable along the long axis of a quad
      const d=(a,c)=>Math.hypot(a[0]-c[0],a[1]-c[1]);let o=d(pts[0],pts[1])>=d(pts[1],pts[2])?0:1;
      const q=[0,1,2,3].map(k=>pts[(k+o)%4]);const m1=[(q[1][0]+q[2][0])/2,(q[1][1]+q[2][1])/2],m0=[(q[3][0]+q[0][0])/2,(q[3][1]+q[0][1])/2];
      const Y=y1+ridge;
      face([q[0][0],y1,q[0][1]],[q[1][0],y1,q[1][1]],[m1[0],Y,m1[1]],roofC);face([q[0][0],y1,q[0][1]],[m1[0],Y,m1[1]],[m0[0],Y,m0[1]],roofC);
      face([q[2][0],y1,q[2][1]],[q[3][0],y1,q[3][1]],[m0[0],Y,m0[1]],roofC);face([q[2][0],y1,q[2][1]],[m0[0],Y,m0[1]],[m1[0],Y,m1[1]],roofC);
      face([q[1][0],y1,q[1][1]],[q[2][0],y1,q[2][1]],[m1[0],Y,m1[1]],wallC);face([q[3][0],y1,q[3][1]],[q[0][0],y1,q[0][1]],[m0[0],Y,m0[1]],wallC);
    }else if(b.r){
      const v=pts.map(p=>new V2(p[0],-p[1]));const tris=THREE.ShapeUtils.triangulateShape(v,[]);
      tris.forEach(([a,c,e])=>face([pts[a][0],y1,pts[a][1]],[pts[c][0],y1,pts[c][1]],[pts[e][0],y1,pts[e][1]],roofC));
    }
  });
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.85,side:THREE.DoubleSide}));m.castShadow=m.receiveShadow=true;scene.add(m);
}
/* filler town beyond the OSM box */
{
  const box=new THREE.BoxGeometry(1,1,1);box.translate(0,.5,0);
  const im=new THREE.InstancedMesh(box,std(0xFFFFFF,{roughness:.85}),SC.filler.length);const dm=new THREE.Object3D();const r=rng(5);const c=new THREE.Color();
  SC.filler.forEach(([x,z,w,d,h,a],k)=>{dm.position.set(x,GY-.2,z);dm.scale.set(w,h,d);dm.rotation.set(0,a,0);dm.updateMatrix();im.setMatrixAt(k,dm.matrix);
    c.set(['#EFE9DE','#E9DFCB','#F2EEE6','#D9D2C4','#E5DAC0'][Math.floor(r()*5)]);im.setColorAt(k,c);});
  im.castShadow=false;im.receiveShadow=true;scene.add(im);
}
/* trees */
const trunkG=new THREE.CylinderGeometry(.25,.4,4,5);trunkG.translate(0,2,0);
const crownG=new THREE.IcosahedronGeometry(3,0);crownG.scale(1,.8,1);crownG.translate(0,5.2,0);
const trunkM=std(0x7C6852),crownM=std(0x5B7A3F,{flatShading:true,roughness:.9});
function forest(list){const it=new THREE.InstancedMesh(trunkG,trunkM,list.length),ic=new THREE.InstancedMesh(crownG,crownM,list.length);const dm=new THREE.Object3D();const r=rng(3);const c=new THREE.Color();
  list.forEach(([x,z,s],k)=>{dm.position.set(x,GY,z);dm.scale.setScalar(s);dm.rotation.y=r()*6;dm.updateMatrix();it.setMatrixAt(k,dm.matrix);ic.setMatrixAt(k,dm.matrix);
    c.setHSL(.24+r()*.05,.3+r()*.15,.36+r()*.1);ic.setColorAt(k,c);});
  ic.castShadow=true;scene.add(it,ic);}
forest(SC.trees);
// palms (riverfront + plot)
const palmG=(()=>{const g=new THREE.Group();return g;})();
const palmTrunk=new THREE.CylinderGeometry(.2,.34,9,6);palmTrunk.translate(0,4.5,0);
const leafG=(()=>{const g=new THREE.PlaneGeometry(1,4.6,1,4);g.translate(0,2.3,0);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const y=p.getY(i);p.setZ(i,-.06*y*y);p.setX(i,p.getX(i)*(1-y/5.2)*.9);}g.rotateX(-Math.PI/2+.45);g.computeVertexNormals();return g;})();
const palmTM=std(0x8B7A63),palmFM=std(0x4E7A3A,{side:THREE.DoubleSide,roughness:.8});
function palms(list){const a=new THREE.InstancedMesh(palmTrunk,palmTM,list.length),b=new THREE.InstancedMesh(leafG,palmFM,list.length*9);const dm=new THREE.Object3D(),lm=new THREE.Object3D();
  list.forEach(([x,y,z,s],k)=>{dm.position.set(x,y,z);dm.scale.setScalar(s);dm.rotation.set(0,k,0);dm.updateMatrix();a.setMatrixAt(k,dm.matrix);
    for(let j=0;j<9;j++){lm.position.set(x,y+9*s,z);lm.rotation.set(0,k+j/9*Math.PI*2,0,'YXZ');lm.scale.setScalar(s*(.9+(j%3)*.08));lm.updateMatrix();b.setMatrixAt(k*9+j,lm.matrix);}});
  b.castShadow=true;a.castShadow=true;scene.add(a,b);}

/* ---------------- the project, from the architect's drawings ---------------- */
const AR=await (await fetch('scene/arch.json')).json();
const FH=AR.FH, BASE=AR.BASE, NFLO=6, SB=AR.site;
const sg=new THREE.Group();sg.position.set(PLOT.x,GY,PLOT.z);sg.rotation.y=-SB.bearing_up*Math.PI/180;scene.add(sg);sg.updateMatrixWorld(true);
const S2W=(u,y,v)=>sg.localToWorld(new V3(u,y,v));
const loadTex=u=>new Promise(r=>new THREE.TextureLoader().load(u,t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=MAXANI;r(t);}));
// the site plan as the ground inside the development
{ const t=await loadTex('scene/siteplan.png');const [u0,v0,u1,v1]=AR.frame;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(u1-u0,v1-v0),new THREE.MeshStandardMaterial({map:t,transparent:true,roughness:.95,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2}));
  m.rotation.x=-Math.PI/2;m.position.set((u0+u1)/2,.05,(v0+v1)/2);m.receiveShadow=true;m.renderOrder=1;sg.add(m); }
// facade textures (units: metres; one tile = one 3.4 m bay x one storey)
function facadeTex(kind){return ctex(340,290,(g,w,h)=>{
  g.fillStyle='#F4F2EE';g.fillRect(0,0,w,h);
  g.fillStyle='rgba(0,0,0,.05)';g.fillRect(0,h-26,w,26);                     // slab edge shadow
  if(kind==='pent'){g.fillStyle='#3B464D';g.fillRect(30,40,280,210);g.fillStyle='#4E3A2B';for(let x=30;x<=310;x+=70)g.fillRect(x-3,40,6,210);g.fillRect(30,40,280,6);}
  else{const gr=g.createLinearGradient(0,60,0,235);gr.addColorStop(0,'#7C8C94');gr.addColorStop(.45,'#4F5D64');gr.addColorStop(1,'#3A464C');
    g.fillStyle=gr;g.fillRect(80,60,180,175);g.strokeStyle='#2E2E2E';g.lineWidth=6;g.strokeRect(80,60,180,175);g.beginPath();g.moveTo(170,60);g.lineTo(170,235);g.stroke();
    g.fillStyle='rgba(40,48,52,.35)';g.fillRect(70,190,200,4);g.fillStyle='rgba(230,236,238,.18)';g.fillRect(70,194,200,41);
    if(kind==='ground'){g.fillStyle='#5A4636';g.fillRect(0,h-60,w,60);}}
},[1/3.4,1/FH]);}
const texF=facadeTex('floor'),texG=facadeTex('ground'),texP=facadeTex('pent');
const capM=std(0xF2F0EB,{roughness:.8}),roofM=std(0xC9C1B3,{roughness:.9});
const sideF=std(0xFFFFFF,{map:texF,roughness:.75}),sideG=std(0xFFFFFF,{map:texG,roughness:.75}),sideP=std(0xFFFFFF,{map:texP,roughness:.6});
const brown=std(0x5A4636,{roughness:.7}),railM=new THREE.MeshStandardMaterial({color:0x3A342F,transparent:true,opacity:.55,roughness:.6,side:THREE.DoubleSide,depthWrite:false});
function shapeOf(fp){const s=new THREE.Shape(fp.outer.map(([u,v])=>new V2(u,-v)));fp.holes.forEach(h=>s.holes.push(new THREE.Path(h.map(([u,v])=>new V2(u,-v)))));return s;}
function extrude(fp,depth,mats,y,parent){const geo=new THREE.ExtrudeGeometry(shapeOf(fp),{depth,bevelEnabled:false,curveSegments:2});geo.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(geo,mats);m.position.y=y;m.castShadow=m.receiveShadow=true;parent.add(m);return m;}
function ribbon(pts,y,h,mat,parent){const P=[],I=[];pts.forEach(([u,v],i)=>{P.push(u,y,v,u,y+h,v);});const n=pts.length;
  for(let i=0;i<n;i++){const j=(i+1)%n;I.push(2*i,2*j,2*i+1,2*i+1,2*j,2*j+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setIndex(I);g.computeVertexNormals();const m=new THREE.Mesh(g,mat);parent.add(m);return m;}
const towerMeshes=[];const tag=(m,t,f)=>{m.userData={tower:t,floor:f};towerMeshes.push(m);return m;};
function inPoly(p,x,y){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const [xi,yi]=p[i],[xj,yj]=p[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
const blocks=[];
SB.blocks.forEach(([bu,bv],ti)=>{
  const bg=new THREE.Group();bg.position.set(bu,0,bv);bg.rotation.y=Math.PI/2;sg.add(bg);
  tag(extrude(AR.p1,BASE,[brown,brown],0,bg),ti,-1);                              // plinth
  for(let f=0;f<5;f++)tag(extrude(AR.p1,FH,[capM,f===0?sideG:sideF],BASE+f*FH,bg),ti,f);
  tag(extrude(AR.p1,.35,[capM,capM],BASE+5*FH,bg),ti,-1);                          // level-4 roof = penthouse terraces
  tag(extrude(AR.rec,FH-.35,[capM,sideP],BASE+5*FH+.35,bg),ti,5);
  tag(extrude(AR.rec,.4,[roofM,capM],BASE+6*FH,bg),ti,-1);
  const r1=ribbon(AR.p1.outer,BASE+5*FH+.35,1.05,railM,bg);AR.p1.holes.forEach(h=>ribbon(h,BASE+5*FH+.35,1.05,railM,bg));
  const r2=ribbon(AR.rec.outer,BASE+6*FH+.4,.9,railM,bg);
  // solar panels + chimneys on the penthouse roof
  const pan=[],chim=[];const r=rng(40+ti);
  for(let u=-34;u<34;u+=3.2)for(let v=-46;v<46;v+=2.6){if(!inPoly(AR.rec.outer,u,v)||AR.rec.holes.some(h=>inPoly(h,u,v)))continue;
    if(!inPoly(AR.rec.outer,u+1.8,v)||!inPoly(AR.rec.outer,u-1.8,v)||!inPoly(AR.rec.outer,u,v+1.6)||!inPoly(AR.rec.outer,u,v-1.6))continue;
    if(AR.rec.holes.some(h=>inPoly(h,u+2,v)||inPoly(h,u-2,v)||inPoly(h,u,v+2)||inPoly(h,u,v-2)))continue;
    if(r()<.55)pan.push([u,v]);else if(r()<.12)chim.push([u,v]);}
  const pg=new THREE.BoxGeometry(2.8,.08,1.6);pg.rotateX(-.35);const pm=new THREE.InstancedMesh(pg,std(0x2B3A55,{roughness:.25,metalness:.4}),pan.length);
  const cg=new THREE.BoxGeometry(.7,1.2,.7),cm=new THREE.InstancedMesh(cg,std(0x3E3128),chim.length);const dm=new THREE.Object3D();
  pan.forEach(([u,v],k)=>{dm.position.set(u,BASE+6*FH+.9,v);dm.rotation.set(0,0,0);dm.updateMatrix();pm.setMatrixAt(k,dm.matrix);});
  chim.forEach(([u,v],k)=>{dm.position.set(u,BASE+6*FH+1,v);dm.updateMatrix();cm.setMatrixAt(k,dm.matrix);});
  pm.castShadow=true;bg.add(pm,cm);
  bg.updateMatrixWorld(true);blocks.push({bg,ti});
});
// commercial building (offices): 4 storeys, dark glass between white projecting slabs
{ const C=SB.commercial,cu=(C.u0+C.u1)/2,cv=(C.v0+C.v1)/2,L=C.u1-C.u0,D=C.v1-C.v0,HF=3.8;
  const glass=std(0x2A3238,{roughness:.1,metalness:.5}),white=std(0xF4F2EE,{roughness:.6});
  const cgp=new THREE.Group();cgp.position.set(cu,0,cv);sg.add(cgp);
  const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;cgp.add(o);return o;};
  box(L*.42,HF,D-2,glass,-L*.29,HF/2,0);box(L*.42,HF,D-2,glass,L*.29,HF/2,0);             // ground floor, passage in the middle
  for(let f=1;f<4;f++){box(L-2,HF-.4,D-3,glass,0,f*HF+(HF-.4)/2,0);box(L+2,.35,D+1.5,white,0,f*HF,0);}
  box(L+2,.5,D+1.5,white,0,4*HF,0);box(L*.4,2.6,D*.5,white,0,4*HF+1.55,0);
  box(1.2,4*HF+.5,D+1.5,white,-L/2-.4,(4*HF+.5)/2,0);box(1.2,4*HF+.5,D+1.5,white,L/2+.4,(4*HF+.5)/2,0);
  cgp.traverse(o=>{if(o.isMesh)o.userData={comm:1};});
}
// pavilions (sales office / café)
SB.pavilions.forEach(P=>{const o=new THREE.Mesh(new THREE.BoxGeometry(P.u1-P.u0,P.h,P.v1-P.v0),std(0xF4F2EE));o.position.set((P.u0+P.u1)/2,P.h/2,(P.v0+P.v1)/2);o.castShadow=true;sg.add(o);
  const r=new THREE.Mesh(new THREE.BoxGeometry(P.u1-P.u0+1,.3,P.v1-P.v0+1),std(0xB89A74));r.position.set((P.u0+P.u1)/2,P.h+.15,(P.v0+P.v1)/2);sg.add(r);});
// trees: parking pits from the site plan + a ring in each courtyard
{ const list=SB.trees.map(([u,v])=>{const w=S2W(u,0,v);return [w.x,w.z,1.15];});
  blocks.forEach(({bg})=>{const h=AR.p1.holes[0];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;h.forEach(([u,v])=>{x0=Math.min(x0,u);x1=Math.max(x1,u);y0=Math.min(y0,v);y1=Math.max(y1,v);});
    const r=rng(7);for(let k=0;k<26;k++){const t=k/26*Math.PI*2;const u=(x0+x1)/2+Math.cos(t)*((x1-x0)/2-4.5),v=(y0+y1)/2+Math.sin(t)*((y1-y0)/2-4.5);const w=bg.localToWorld(new V3(u,0,v));list.push([w.x,w.z,.75+r()*.35]);}});
  forest(list); }
const siteCenter=S2W(0,10,0);

{
